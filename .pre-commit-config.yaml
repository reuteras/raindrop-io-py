fail_fast: true
repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.15
  hooks:
    - id: ruff
      name: Running ruff linter
      args: ["--fix", "raindropiopy/"]
    - id: ruff-format
      name: Running ruff formatter
      args: ["raindropiopy/"]
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
    name: Running check for large files
- repo: https://github.com/jendrikseipp/vulture
  rev: 'v2.16'  # or any later Vulture version
  hooks:
  - id: vulture
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.25.2
  hooks:
    - id: zizmor
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.1
  hooks:
    - id: markdownlint
- repo: local
  hooks:
    - id: markdown-table-formatter
      name: markdown-table-formatter
      entry: npx markdown-table-formatter
      language: node
      types: [markdown]
      additional_dependencies: ["markdown-table-formatter@1.6.1"]
